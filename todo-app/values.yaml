# Default values for todo-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Backend configuration
backend:
  enabled: true
  replicaCount: 1

  image:
    repository: evolution-todo-backend
    tag: latest
    pullPolicy: Never  # For Minikube (images loaded locally)

  service:
    type: NodePort
    port: 8001
    nodePort: 30001

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    allowPrivilegeEscalation: false

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 1

  image:
    repository: evolution-todo-frontend
    tag: latest
    pullPolicy: Never  # For Minikube (images loaded locally)

  service:
    type: NodePort
    port: 3000

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    allowPrivilegeEscalation: false

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001

# Configuration (non-sensitive)
config:
  corsOrigins: "http://localhost:3000"
  backendUrl: "http://todo-app-backend:8001"

# Service account configuration
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Pod annotations and labels
podAnnotations: {}
podLabels: {}

# Node selector, tolerations, and affinity
nodeSelector: {}
tolerations: []
affinity: {}

# Ingress (not used for Minikube)
ingress:
  enabled: false

# Autoscaling (not used for Minikube)
autoscaling:
  enabled: false
