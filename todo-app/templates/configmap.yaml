apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "todo-app.fullname" . }}-config
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  NEXT_PUBLIC_API_URL: {{ .Values.config.backendUrl | quote }}
