openapi: 3.0.3
info:
  title: Evolution Todo - Agent Chat API
  description: |
    REST API endpoint for interacting with the AI agent for natural language task management.

    The agent processes user messages, understands intent, and invokes appropriate MCP tools
    (add_task, list_tasks, complete_task, update_task, delete_task) to perform task operations.

    **Authentication**: All endpoints require a valid JWT token in the Authorization header.

    **Rate Limiting**: 10 requests per minute per user (recommended).
  version: 1.0.0
  contact:
    name: Evolution Todo API Support

servers:
  - url: http://localhost:8000/api
    description: Local development server
  - url: https://api.evolution-todo.com/api
    description: Production server

tags:
  - name: chat
    description: AI agent chat operations

paths:
  /chat:
    post:
      tags:
        - chat
      summary: Send message to AI agent
      description: |
        Send a natural language message to the AI agent and receive a response.

        The agent will:
        1. Understand the user's intent
        2. Invoke appropriate MCP tools (with user_id from JWT token)
        3. Generate a friendly, conversational response

        **Supported Intents**:
        - Add task: "Add a task to buy groceries"
        - List tasks: "Show my pending tasks"
        - Complete task: "Mark task abc-123 as done"
        - Update task: "Rename the meeting task to 'Team standup'"
        - Delete task: "Delete the grocery task"

        **Multi-Step Operations**:
        The agent can chain multiple tool invocations (max 3) to handle complex requests
        like "Delete the meeting task" (list → delete).

        **Response Time**: 95% of requests complete within 5 seconds.

        **Error Handling**: All errors return user-friendly messages with appropriate HTTP status codes.
      operationId: sendChatMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            examples:
              addTask:
                summary: Add a task
                value:
                  message: "Add a task to buy groceries"
              listTasks:
                summary: List pending tasks
                value:
                  message: "Show my pending tasks"
              completeTask:
                summary: Complete a task
                value:
                  message: "Mark task abc-123 as done"
              updateTask:
                summary: Update a task
                value:
                  message: "Rename the meeting task to 'Team standup notes'"
              deleteTask:
                summary: Delete a task
                value:
                  message: "Delete the grocery task"
      responses:
        '200':
          description: Agent successfully processed the message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
              examples:
                addTaskSuccess:
                  summary: Task created successfully
                  value:
                    response: "I've created a task 'Buy groceries' for you. The task ID is abc-123."
                    tool_calls:
                      - tool: "add_task"
                        arguments:
                          title: "Buy groceries"
                        result:
                          task_id: "abc-123"
                          status: "created"
                          title: "Buy groceries"
                          completed: false
                listTasksSuccess:
                  summary: Tasks listed successfully
                  value:
                    response: "You have 3 pending tasks: 1) Buy groceries, 2) Finish report, 3) Team meeting."
                    tool_calls:
                      - tool: "list_tasks"
                        arguments:
                          status: "pending"
                        result:
                          tasks:
                            - task_id: "abc-123"
                              title: "Buy groceries"
                              completed: false
                            - task_id: "def-456"
                              title: "Finish report"
                              completed: false
                            - task_id: "ghi-789"
                              title: "Team meeting"
                              completed: false
                          count: 3
                multiStepSuccess:
                  summary: Multi-step operation (list then delete)
                  value:
                    response: "I've deleted the 'Team meeting' task for you."
                    tool_calls:
                      - tool: "list_tasks"
                        arguments:
                          search: "meeting"
                        result:
                          tasks:
                            - task_id: "ghi-789"
                              title: "Team meeting"
                              completed: false
                          count: 1
                      - tool: "delete_task"
                        arguments:
                          task_id: "ghi-789"
                        result:
                          task_id: "ghi-789"
                          status: "deleted"
                          message: "Task ghi-789 successfully deleted"
        '400':
          description: Invalid request (empty message, malformed JSON, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emptyMessage:
                  summary: Empty message
                  value:
                    error: true
                    message: "Message cannot be empty"
                    status_code: 400
        '401':
          description: Unauthorized (missing or invalid JWT token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingToken:
                  summary: Missing JWT token
                  value:
                    error: true
                    message: "Authentication required"
                    status_code: 401
                invalidToken:
                  summary: Invalid JWT token
                  value:
                    error: true
                    message: "Invalid or expired token"
                    status_code: 401
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rateLimitExceeded:
                  summary: Too many requests
                  value:
                    error: true
                    message: "Rate limit exceeded. Please try again in 60 seconds."
                    status_code: 429
        '500':
          description: Internal server error (OpenAI API failure, database error, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                openaiError:
                  summary: OpenAI API error
                  value:
                    error: true
                    message: "I encountered an issue processing your request. Please try again later."
                    status_code: 500
                timeout:
                  summary: Request timeout
                  value:
                    error: true
                    message: "Request timed out. Please try again."
                    status_code: 500
                complexOperation:
                  summary: Operation too complex
                  value:
                    error: true
                    message: "Operation too complex. Please break it into smaller requests."
                    status_code: 500

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from /api/auth/login endpoint.

        Include in Authorization header: `Authorization: Bearer <token>`

  schemas:
    ChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Natural language message from the user
          minLength: 1
          maxLength: 2000
          example: "Add a task to buy groceries"
      example:
        message: "Show my pending tasks"

    ChatResponse:
      type: object
      required:
        - response
      properties:
        response:
          type: string
          description: Natural language response from the agent
          example: "I've created a task 'Buy groceries' for you. The task ID is abc-123."
        tool_calls:
          type: array
          description: List of MCP tools invoked during processing (for debugging/transparency)
          items:
            $ref: '#/components/schemas/ToolCall'
          example:
            - tool: "add_task"
              arguments:
                title: "Buy groceries"
              result:
                task_id: "abc-123"
                status: "created"
      example:
        response: "You have 3 pending tasks: Buy groceries, Finish report, Team meeting."
        tool_calls:
          - tool: "list_tasks"
            arguments:
              status: "pending"
            result:
              tasks:
                - task_id: "abc-123"
                  title: "Buy groceries"
                  completed: false
              count: 3

    ToolCall:
      type: object
      required:
        - tool
        - arguments
        - result
      properties:
        tool:
          type: string
          description: Name of the MCP tool invoked
          enum:
            - add_task
            - list_tasks
            - complete_task
            - update_task
            - delete_task
          example: "add_task"
        arguments:
          type: object
          description: Arguments passed to the tool (without user_id, which is injected)
          additionalProperties: true
          example:
            title: "Buy groceries"
        result:
          type: object
          description: Result returned by the tool
          additionalProperties: true
          example:
            task_id: "abc-123"
            status: "created"

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: boolean
          description: Always true for error responses
          example: true
        message:
          type: string
          description: User-friendly error message
          example: "I encountered an issue processing your request. Please try again later."
        status_code:
          type: integer
          description: HTTP status code
          example: 500
      example:
        error: true
        message: "Authentication required"
        status_code: 401
